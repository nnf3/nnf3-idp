services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [idp]

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    command: migrate sql -e --yes -c /etc/config/kratos/kratos.yml
    environment:
      DSN: ${KRATOS_DSN:-postgres://kratos:secret@postgres:5432/kratos?sslmode=disable}
    volumes:
      - ./config/kratos:/etc/config/kratos:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [idp]
    restart: on-failure

  kratos:
    image: oryd/kratos:v26.2.0
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    environment:
      DSN: ${KRATOS_DSN:-postgres://kratos:secret@postgres:5432/kratos?sslmode=disable}
    ports:
      - "4433:4433"
      - "4434:4434"
    volumes:
      - ./config/kratos:/etc/config/kratos:ro
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    networks: [idp]
    restart: unless-stopped

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    command: migrate -c /etc/config/hydra/hydra.yml sql up -e --yes
    environment:
      DSN: ${HYDRA_DSN:-postgres://hydra:secret@postgres:5432/hydra?sslmode=disable}
    volumes:
      - ./config/hydra:/etc/config/hydra:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [idp]
    restart: on-failure

  hydra:
    image: oryd/hydra:v26.2.0
    command: serve -c /etc/config/hydra/hydra.yml all --dev
    environment:
      DSN: ${HYDRA_DSN:-postgres://hydra:secret@postgres:5432/hydra?sslmode=disable}
    ports:
      - "4444:4444"
      - "4445:4445"
    volumes:
      - ./config/hydra:/etc/config/hydra:ro
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    networks: [idp]
    restart: unless-stopped

  ui:
    image: oryd/kratos-selfservice-ui-node:v26.2.0
    environment:
      PORT: "4455"
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_BROWSER_URL: http://127.0.0.1:4433
      KRATOS_ADMIN_URL: http://kratos:4434
      HYDRA_ADMIN_URL: http://hydra:4445
      COOKIE_SECRET: ${COOKIE_SECRET:-local-cookie-secret-change-me}
      CSRF_COOKIE_NAME: ory_csrf_ui
      CSRF_COOKIE_SECRET: ${CSRF_COOKIE_SECRET:-local-csrf-secret-change-me}
      DANGEROUSLY_DISABLE_SECURE_CSRF_COOKIES: "true"
      TRUSTED_CLIENT_IDS: ${FIRST_PARTY_CLIENT_ID:-nnf3-web}
    ports:
      - "4455:4455"
    depends_on:
      - kratos
      - hydra
    networks: [idp]
    restart: unless-stopped

  mailslurper:
    image: oryd/mailslurper:latest-smtps
    ports:
      - "4436:4436"
      - "4437:4437"
    networks: [idp]

  sample-web:
    image: python:3.12-alpine
    command: python /app/server.py
    environment:
      PORT: "3000"
      HYDRA_TOKEN_URL: http://hydra:4444/oauth2/token
      FIRST_PARTY_CLIENT_ID: ${FIRST_PARTY_CLIENT_ID:-nnf3-web}
      FIRST_PARTY_REDIRECT_URI: ${FIRST_PARTY_REDIRECT_URI:-http://127.0.0.1:3000/callback}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/sample-web:/app:ro
    depends_on:
      - hydra
    networks: [idp]
    restart: unless-stopped

networks:
  idp:

volumes:
  pgdata:
