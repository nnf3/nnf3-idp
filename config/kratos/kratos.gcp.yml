version: v1

serve:
  public:
    port: 8080
    cors:
      enabled: true
  admin:
    port: 4434

oauth2_provider:
  override_return_to: true

selfservice:
  methods:
    password:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true

  flows:
    settings:
      privileged_session_max_age: 15m
    recovery:
      enabled: true
      use: code
    verification:
      enabled: true
      use: code
    login:
      lifespan: 10m
    registration:
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

log:
  level: info
  format: json
  leak_sensitive_values: false
