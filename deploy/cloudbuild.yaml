steps:
  - id: build-kratos
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - deploy/kratos/Dockerfile
      - -t
      - ${_REPO}/kratos:${_TAG}
      - .
  - id: build-hydra
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - deploy/hydra/Dockerfile
      - -t
      - ${_REPO}/hydra:${_TAG}
      - .
  - id: build-ui
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - deploy/ui/Dockerfile
      - -t
      - ${_REPO}/ui:${_TAG}
      - .
  - id: migrate-kratos
    name: ${_REPO}/kratos:${_TAG}
    waitFor: [build-kratos]
    entrypoint: sh
    args:
      - -c
      - |
        if [ "${_MIGRATE}" != "true" ]; then
          echo "MIGRATE=false; skipping Kratos migrate."
          exit 0
        fi
        export DSN="$$KRATOS_DSN"
        exec kratos migrate sql -e --yes -c /etc/config/kratos/kratos.gcp.yml
    secretEnv:
      - KRATOS_DSN
  - id: migrate-hydra
    name: ${_REPO}/hydra:${_TAG}
    waitFor: [build-hydra]
    entrypoint: sh
    args:
      - -c
      - |
        if [ "${_MIGRATE}" != "true" ]; then
          echo "MIGRATE=false; skipping Hydra migrate."
          exit 0
        fi
        export DSN="$$HYDRA_DSN"
        export SECRETS_SYSTEM="$$HYDRA_SYSTEM"
        export URLS_SELF_ISSUER="${_HYDRA_PUBLIC_URL}"
        export URLS_LOGIN="${_UI_URL}/login"
        export URLS_CONSENT="${_UI_URL}/consent"
        export URLS_LOGOUT="${_UI_URL}/logout"
        exec hydra migrate -c /etc/config/hydra/hydra.gcp.yml sql up -e --yes
    secretEnv:
      - HYDRA_DSN
      - HYDRA_SYSTEM
  # images: は全ステップ成功後にしか push しないので、Cloud Run 更新より先に Registry へ出す
  - id: push-kratos
    name: gcr.io/cloud-builders/docker
    waitFor: [build-kratos]
    args:
      - push
      - ${_REPO}/kratos:${_TAG}
  - id: push-hydra
    name: gcr.io/cloud-builders/docker
    waitFor: [build-hydra]
    args:
      - push
      - ${_REPO}/hydra:${_TAG}
  - id: push-ui
    name: gcr.io/cloud-builders/docker
    waitFor: [build-ui]
    args:
      - push
      - ${_REPO}/ui:${_TAG}
  - id: update-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor:
      - migrate-kratos
      - migrate-hydra
      - push-kratos
      - push-hydra
      - push-ui
    entrypoint: bash
    args:
      - deploy/update-run-images.sh
    env:
      - PROJECT_ID=${_PROJECT_ID}
      - REGION=${_REGION}
      - ENV=${_ENV}
      - REPO=${_REPO}
      - TAG=${_TAG}
      - DEPLOY=${_DEPLOY}
      - TARGET=all
  - id: sync-clients
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    waitFor: [update-run]
    entrypoint: bash
    args:
      - deploy/run-sync-oauth-clients.sh
    env:
      - PROJECT_ID=${_PROJECT_ID}
      - REGION=${_REGION}
      - ENV=${_ENV}
      - SYNC_CLIENTS=${_SYNC_CLIENTS}
images:
  - ${_REPO}/kratos:${_TAG}
  - ${_REPO}/hydra:${_TAG}
  - ${_REPO}/ui:${_TAG}
availableSecrets:
  secretManager:
    - versionName: projects/${_PROJECT_ID}/secrets/idp-${_ENV}-kratos-dsn-direct/versions/latest
      env: KRATOS_DSN
    - versionName: projects/${_PROJECT_ID}/secrets/idp-${_ENV}-hydra-dsn-direct/versions/latest
      env: HYDRA_DSN
    - versionName: projects/${_PROJECT_ID}/secrets/idp-${_ENV}-hydra-system/versions/latest
      env: HYDRA_SYSTEM
substitutions:
  _TAG: v26.2.0-r1
  _REPO: unused
  _PROJECT_ID: unused
  _REGION: asia-southeast1
  _ENV: dev
  _HYDRA_PUBLIC_URL: unused
  _UI_URL: unused
  _DEPLOY: auto
  _MIGRATE: "false"
  _SYNC_CLIENTS: "false"
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
